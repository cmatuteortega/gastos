name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # te permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los runners de GitHub ya traen el Android SDK preinstalado,
      # así que no hace falta descargarlo aparte.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: gastoslistener-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
